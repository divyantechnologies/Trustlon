name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Backend API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trustlon
          POSTGRES_PASSWORD: trustlon
          POSTGRES_DB: trustlon_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U trustlon"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://trustlon:trustlon@localhost:5432/trustlon_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
        working-directory: backend/api
      - run: npm run typecheck -w backend/api
      - run: npm test -w backend/api
      - run: npm run test:e2e -w backend/api
      - run: npm run build -w backend/api

  storefront:
    name: Storefront
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w frontend/storefront
      - run: npm run build -w frontend/storefront
